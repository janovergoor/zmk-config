# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: corne_choc_pro_right
    shield: nice_view
    snippet: studio-rpc-usb-uart

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: corne_choc_mod_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: corne_choc_mod_right
    shield: nice_view
    snippet: studio-rpc-usb-uart

  - board: corne_choc_mod_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_mod_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: corne_choc_single_right_board
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: corne_choc_single_right_board
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: corne_choc_single_left_board
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: corne_choc_single_left_board
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # --- Perpetual (48-key split, nice!nano v2 + nice!view) -------------------
  # Shield, not a board: perpetual_left/right sit on a nice_nano_v2.
  # No `nice_view_adapter` -- the shield's own boards/nice_nano_v2.overlay
  # already provides the `&nice_view_spi` bus the nice_view shield needs.
  # No `-DCONFIG_ZMK_STUDIO=y` yet: the shield has no `zmk,physical-layout`
  # node, which Studio needs to draw a keymap. Add one and this can join the
  # corne builds above.
  - board: nice_nano_v2
    shield: perpetual_left nice_view
    artifact-name: perpetual_left
  - board: nice_nano_v2
    shield: perpetual_right nice_view
    artifact-name: perpetual_right

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: perpetual_settings_reset
